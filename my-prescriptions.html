<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0284C7">
<title>My Prescriptions - FX PHARMARKET</title>
<!-- hidden until the login guard confirms a real customer (unchanged) -->
<script>document.documentElement.style.visibility = "hidden";</script>
<noscript><style>html{visibility:visible !important}</style></noscript>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#0284C7; --sky:#38BDF8; --green:#A7E8C0; --fresh:#86D9A7; --soft:#F5FAFF;
    --text:#3b5b6e; --ink:#17435a; --line:rgba(56,189,248,.32); --danger:#b64a4a;
    --shadow:0 10px 34px rgba(2,132,199,.10), 0 2px 8px rgba(134,217,167,.18);
    --shadow-up:0 20px 44px rgba(2,132,199,.20), 0 6px 14px rgba(134,217,167,.26);
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);line-height:1.6;
    -webkit-font-smoothing:antialiased;padding-bottom:calc(60px + env(safe-area-inset-bottom,0px));
    background:radial-gradient(700px 420px at 100% -4%,rgba(167,232,192,.50),transparent 62%),
               radial-gradient(760px 460px at -10% 4%,rgba(56,189,248,.20),transparent 62%),var(--soft);
    background-attachment:fixed}
  :focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:12px}

  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));
    background:rgba(255,255,255,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--deep);letter-spacing:.02em}
  .mark{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--sky),var(--green))}
  .mark svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round}
  .home{color:var(--deep);background:#fff;text-decoration:none;font-weight:800;font-size:.88rem;padding:9px 15px;border-radius:999px;border:1px solid var(--line);transition:transform .3s,box-shadow .3s}
  .home:hover{transform:translateY(-2px);box-shadow:var(--shadow)}

  .rx-wrap{max-width:600px;margin:0 auto;padding:22px 16px 20px}
  .rx-wrap h1{color:var(--deep);font-size:clamp(1.7rem,6vw,2.1rem);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0 0 6px}
  .rx-sub{margin:0 0 18px;font-size:.96rem}

  /* prescription cards */
  .rx-card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow);transition:transform .4s,box-shadow .4s,border-color .3s}
  .rx-card:hover{box-shadow:var(--shadow-up);border-color:var(--sky)}
  .rx-top{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
  .rx-id{font-weight:800;color:var(--deep);font-size:1.08rem;letter-spacing:.01em}
  .rx-date{font-size:.82rem;margin-top:2px}
  .rx-badge{padding:6px 13px;border-radius:999px;font-size:.76rem;font-weight:800;text-align:center;background:#e1f3fd;color:#0369a1}
  .rx-badge.good{background:var(--green);color:#2c5a46}
  .rx-badge.bad{background:#fdecec;color:#8f3b3b}
  .rx-badge.warn{background:var(--deep);color:#fff;box-shadow:0 6px 16px rgba(2,132,199,.35)}
  .rx-more{margin-top:14px;border-top:1px solid rgba(56,189,248,.28);padding-top:14px}
  .rx-more p{margin:7px 0;font-size:.92rem;word-break:break-word;color:var(--ink)}
  .rx-more strong{color:var(--deep)}

  .rx-line{list-style:none;margin:10px 0 0;padding:0 0 0 14px;border-left:3px solid rgba(56,189,248,.35)}
  .rx-line li{position:relative;margin:0 0 14px;padding-left:12px;font-size:.9rem;color:var(--ink)}
  .rx-line li:before{content:"";position:absolute;left:-24px;top:4px;width:13px;height:13px;border-radius:50%;background:linear-gradient(135deg,var(--sky),var(--fresh));border:2px solid #fff;box-shadow:0 0 0 2px rgba(56,189,248,.35)}
  .rx-line li small{display:block;font-size:.78rem;color:var(--text)}

  .rx-btn{display:inline-block;padding:13px 20px;border:0;border-radius:16px;background:var(--deep);color:#fff;font:inherit;font-weight:800;font-size:.95rem;cursor:pointer;text-decoration:none;text-align:center;
    margin:8px 8px 0 0;box-shadow:0 12px 26px rgba(2,132,199,.30);transition:transform .3s,box-shadow .3s,background .3s}
  .rx-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 18px 34px rgba(2,132,199,.40);background:#0276b3}
  .rx-btn.alt{background:#fff;color:var(--deep);border:1.5px solid var(--sky);box-shadow:none}
  .rx-btn.alt:hover:not(:disabled){background:var(--soft);box-shadow:var(--shadow)}
  .rx-btn.green{background:linear-gradient(120deg,var(--green),var(--fresh));color:var(--ink);box-shadow:0 10px 24px rgba(134,217,167,.45)}
  .rx-btn.full{display:block;width:100%;margin-right:0}
  .rx-btn:disabled{opacity:.55;cursor:not-allowed}

  .rx-msg{padding:13px 15px;border-radius:16px;margin-bottom:14px;font-size:.92rem;font-weight:700}
  .rx-msg.error{background:#fdf1f1;border:1px solid #efc3c3;color:#8f3b3b}
  .rx-msg.info{background:#e1f3fd;border:1px solid var(--line);color:var(--deep)}

  /* quotation panel */
  .rx-quote{margin-top:14px;padding:18px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(56,189,248,.12),rgba(167,232,192,.32))}
  .rx-quote p{margin:0 0 6px}
  .rx-price{font-size:2rem;font-weight:800;color:var(--deep);letter-spacing:-.02em;margin:2px 0 10px}
  .rx-quote input[type=text]{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:16px;font:inherit;color:var(--ink);background:#fff;margin-bottom:6px}
  .rx-quote input[type=text]:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 4px rgba(56,189,248,.20)}
  .rx-note{font-size:.85rem;margin:8px 0 0;font-weight:700}

  /* payment panel (shown after she accepts) */
  .rx-pay{margin-top:14px;padding:18px;border-radius:24px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}
  .rx-pay h3{margin:0 0 2px;color:var(--deep);font-size:1.1rem;font-weight:800}
  .rx-pay .amt{font-size:1.8rem;font-weight:800;color:var(--deep);margin:2px 0 12px}
  .opt{border:1.5px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;background:var(--soft)}
  .opt-h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .oico{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,var(--sky),var(--green))}
  .oico svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  .oico.opay{background:#fff;border:1.5px solid var(--green);color:var(--deep);font-weight:800;font-size:.78rem}
  .opt-h strong{display:block;color:var(--deep);font-size:1.02rem}
  .opt-h span{font-size:.84rem}
  .acct{background:#fff;border:1px dashed var(--sky);border-radius:16px;padding:10px 14px;font-size:.92rem;color:var(--ink)}
  .acct div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0}
  .acct b{word-break:break-word;text-align:right}
  .acct button{border:0;background:var(--deep);color:#fff;border-radius:10px;padding:6px 13px;font:inherit;font-weight:800;cursor:pointer;margin-left:8px}
  .paid{margin-top:14px;padding:16px;border-radius:22px;border:1px solid var(--green);background:rgba(167,232,192,.30)}
  .paid strong{display:block;color:#2c5a46}

  #rxImg{max-width:100%;border-radius:18px;margin-top:10px;display:none;border:1px solid var(--line);box-shadow:var(--shadow)}
  .empty{text-align:center;padding:36px 16px;background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>FX PHARMARKET</div>
  <a class="home" href="index.html">Home</a>
</header>

<main class="rx-wrap">
  <h1>My Prescriptions</h1>
  <p class="rx-sub">Follow each prescription from submission to delivery. Tap a prescription to see its progress.</p>

  <div id="rxMsg" class="rx-msg" role="alert" aria-live="polite" hidden></div>
  <div id="rxList"></div>

  <a class="rx-btn full" href="upload-prescription.html">Upload new prescription</a>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<script src="firebase.js"></script>
<script src="prescription-guard.js"></script>
<script>
(function () {
  "use strict";

  /* ===== EDIT HERE if your payment details change ===== */
  var WHATSAPP = "2349160556050";
  var BANK = { bank: "PalmPay", name: "FAYSAL SANI", number: "8986992826" };
  // Pay with OPay for prescriptions needs the OPay Cloud Function to be updated for prescriptions.
  // Keep false until that is done. While false, the OPay button politely points customers to Bank Transfer.
  var OPAY_FOR_RX = false;
  var FUNCTIONS_REGION = "us-central1";
  /* ===================================================== */

  var fdb = firebase.firestore();
  var $ = function (id) { return document.getElementById(id); };
  var started = false;
  var openId = null;          // which card is expanded
  var stopHistory = null;     // unsubscribe for the open card's timeline
  var lastDocs = [];

  var LABELS = {
    submitted: "Submitted",
    reviewing: "Under review",
    quoted: "Quotation ready - your reply needed",
    customer_accepted: "You accepted - order confirmed",
    customer_declined: "You declined the offer",
    rejected: "Not available",
    preparing: "Preparing your order",
    out_for_delivery: "Out for delivery",
    delivered: "Delivered",
    cancelled: "Cancelled"
  };
  var GOOD = ["customer_accepted", "delivered"];
  var BAD = ["rejected", "cancelled", "customer_declined"];
  var WARN = ["quoted"];

  var ICON_BANK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10 12 4l9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></svg>';

  function label(s) { return LABELS[s] || s || "Unknown"; }
  function badgeClass(s) {
    return "rx-badge" + (GOOD.indexOf(s) > -1 ? " good" : BAD.indexOf(s) > -1 ? " bad" : WARN.indexOf(s) > -1 ? " warn" : "");
  }
  function fmt(ts) {
    if (!ts || !ts.toDate) return "just now";
    return ts.toDate().toLocaleString([], { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
  }
  function secs(ts) { return ts && ts.seconds ? ts.seconds : Date.now() / 1000; }
  function money(n) { return "\u20A6" + Number(n).toLocaleString(); }
  function showMsg(text, type) {
    var b = $("rxMsg");
    b.textContent = text;
    b.className = "rx-msg " + type;
    b.hidden = false;
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function addLine(parent, name, value) {
    var p = el("p");
    p.appendChild(el("strong", null, name + ": "));
    p.appendChild(document.createTextNode(value));
    parent.appendChild(p);
  }

  /* ---------- customer answers the quotation ---------- */
  function buildReplyPanel(rx, data) {
    var panel = el("div", "rx-quote");
    var price = money(data.quotationAmount);
    panel.appendChild(el("p", null, "Your medicines are available. Total price:"));
    panel.appendChild(el("div", "rx-price", price));
    panel.appendChild(el("p", null, "Do you want to buy them at this price?"));

    var reply = el("input");
    reply.type = "text";
    reply.maxLength = 200;
    reply.placeholder = "Message to the pharmacist (optional)";

    var msg = el("p", "rx-note");
    msg.style.color = "#8f3b3b";

    var yes = el("button", "rx-btn", "ACCEPT & BUY");
    var no = el("button", "rx-btn alt", "REJECT OFFER");
    yes.type = "button";
    no.type = "button";

    async function send(accept) {
      var text = reply.value.trim().slice(0, 200);
      var ok = accept
        ? confirm("Confirm: you want to buy these medicines for " + price + "?")
        : confirm("Are you sure you want to reject this offer?");
      if (!ok) return;
      yes.disabled = true;
      no.disabled = true;
      msg.style.color = "#0284C7";
      msg.textContent = "Sending your reply...";
      try {
        var ts = firebase.firestore.FieldValue.serverTimestamp();
        var status = accept ? "customer_accepted" : "customer_declined";
        var upd = { status: status, updatedAt: ts };
        if (accept) upd.acceptedAmount = Number(data.quotationAmount);
        if (text) upd.customerReply = text;

        var ref = fdb.collection("prescriptions").doc(rx);
        var batch = fdb.batch();
        batch.update(ref, upd);
        batch.set(ref.collection("history").doc("response"), {
          status: status,
          at: ts,
          by: "customer",
          note: text || (accept ? "Customer accepted the price." : "Customer rejected the offer.")
        });
        await batch.commit();
      } catch (e) {
        console.error("Reply error:", e);
        yes.disabled = false;
        no.disabled = false;
        msg.style.color = "#8f3b3b";
        msg.textContent = (e.code === "permission-denied")
          ? "The pharmacist just changed this quotation. Please refresh and check the new price."
          : "Could not send your reply. Check your internet and try again.";
      }
    }
    yes.addEventListener("click", function () { send(true); });
    no.addEventListener("click", function () { send(false); });

    panel.appendChild(reply);
    panel.appendChild(yes);
    panel.appendChild(no);
    panel.appendChild(msg);
    return panel;
  }

  /* ---------- payment choices, shown after she accepts the quotation ---------- */
  function buildPayPanel(rx, data) {
    var amount = Number(data.acceptedAmount != null ? data.acceptedAmount : data.quotationAmount);
    var ref = "RX-" + rx.slice(-6).toUpperCase();
    var panel = el("div", "rx-pay");
    panel.appendChild(el("h3", null, "Complete your payment"));
    panel.appendChild(el("div", "amt", money(amount)));

    /* option 1: bank transfer */
    var bank = el("div", "opt");
    var bh = el("div", "opt-h");
    var bi = el("span", "oico"); bi.innerHTML = ICON_BANK;
    var bt = el("div");
    bt.appendChild(el("strong", null, "Bank Transfer"));
    bt.appendChild(el("span", null, "Transfer the exact amount, then tell us."));
    bh.appendChild(bi); bh.appendChild(bt);
    bank.appendChild(bh);

    var acct = el("div", "acct");
    function row(a, b, withCopy) {
      var r = el("div");
      r.appendChild(el("span", null, a));
      var right = el("span");
      right.appendChild(el("b", null, b));
      if (withCopy) {
        var cp = el("button", null, "Copy");
        cp.type = "button";
        cp.addEventListener("click", function () {
          function done() { cp.textContent = "Copied"; setTimeout(function () { cp.textContent = "Copy"; }, 1500); }
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(withCopy).then(done, function () { window.prompt("Copy this number:", withCopy); });
          else window.prompt("Copy this number:", withCopy);
        });
        right.appendChild(cp);
      }
      r.appendChild(right);
      acct.appendChild(r);
    }
    row("Bank", BANK.bank);
    row("Account name", BANK.name);
    row("Account number", BANK.number, BANK.number);
    row("Amount", money(amount));
    row("Payment reference", ref);
    bank.appendChild(acct);

    var sent = el("a", "rx-btn green full", "I have sent the money");
    sent.target = "_blank";
    sent.rel = "noopener";
    sent.href = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(
      "FX PHARMARKET prescription " + ref + "\nI have sent " + money(amount) + " by bank transfer. Please confirm my payment.");
    bank.appendChild(sent);
    panel.appendChild(bank);

    /* option 2: OPay */
    var op = el("div", "opt");
    var oh = el("div", "opt-h");
    var oi = el("span", "oico opay", "OPay");
    var ot = el("div");
    ot.appendChild(el("strong", null, "Pay with OPay"));
    ot.appendChild(el("span", null, "Pay online on OPay's secure page."));
    oh.appendChild(oi); oh.appendChild(ot);
    op.appendChild(oh);
    var opMsg = el("p", "rx-note");
    var opBtn = el("button", "rx-btn full", "Pay with OPay");
    opBtn.type = "button";
    opBtn.addEventListener("click", function () {
      if (!OPAY_FOR_RX) {
        opMsg.style.color = "#0284C7";
        opMsg.textContent = "OPay for prescriptions is being activated. Please use Bank Transfer for now.";
        return;
      }
      opBtn.disabled = true; opBtn.textContent = "Opening OPay...";
      firebase.app().functions(FUNCTIONS_REGION).httpsCallable("startOpayPayment")({ prescriptionId: rx })
        .then(function (r) {
          var url = r && r.data && r.data.cashierUrl;
          if (url && url.indexOf("https://") === 0) location.href = url; else throw new Error("no url");
        }).catch(function () {
          opBtn.disabled = false; opBtn.textContent = "Pay with OPay";
          opMsg.style.color = "#8f3b3b";
          opMsg.textContent = "Could not open OPay. Please try again or use Bank Transfer.";
        });
    });
    op.appendChild(opBtn);
    op.appendChild(opMsg);
    panel.appendChild(op);

    panel.appendChild(el("p", "rx-note", "We start preparing your medicines once your payment is confirmed."));
    return panel;
  }

  /* ---------- details of one prescription ---------- */
  function buildDetails(rx, data) {
    var box = el("div", "rx-more");
    addLine(box, "Status", label(data.status));
    addLine(box, "Phone", data.phone || "-");
    addLine(box, "Delivery address", data.deliveryAddress || "-");
    if (data.customerNotes) addLine(box, "Your notes", data.customerNotes);
    if (data.quotationAmount != null && data.quotationAmount !== "") {
      addLine(box, "Quotation", money(data.quotationAmount));
    }
    if (data.adminNote) addLine(box, "Pharmacist note", data.adminNote);
    if (data.acceptedAmount != null) {
      addLine(box, "You agreed to pay", money(data.acceptedAmount));
    }

    // Customer must answer the quotation
    if (data.status === "quoted" && data.quotationAmount != null) {
      box.appendChild(buildReplyPanel(rx, data));
    }

    // After she accepts: show how to pay (or a confirmation once the server marks it paid)
    if (data.status === "customer_accepted" && (data.acceptedAmount != null || data.quotationAmount != null)) {
      if (data.paymentStatus === "paid" && data.paymentVerified === true) {
        var ok = el("div", "paid");
        ok.appendChild(el("strong", null, "\u2713 Payment verified"));
        ok.appendChild(el("span", null, "Thank you. We are preparing your medicines."));
        box.appendChild(ok);
      } else {
        box.appendChild(buildPayPanel(rx, data));
      }
    }

    box.appendChild(el("p", null, "")).appendChild(el("strong", null, "Progress"));
    var ul = el("ul", "rx-line");
    ul.id = "tl-" + rx;
    ul.appendChild(el("li", null, "Loading..."));
    box.appendChild(ul);

    var btn = el("button", "rx-btn alt", "View my prescription photo");
    btn.type = "button";
    var img = el("img");
    img.id = "rxImg";
    img.alt = "Prescription photo";
    btn.addEventListener("click", function () { loadImage(rx, btn, img); });
    box.appendChild(btn);
    box.appendChild(img);
    return box;
  }

  function watchHistory(rx) {
    if (stopHistory) { stopHistory(); stopHistory = null; }
    stopHistory = fdb.collection("prescriptions").doc(rx).collection("history")
      .orderBy("at")
      .onSnapshot(function (snap) {
        var ul = $("tl-" + rx);
        if (!ul) return;
        ul.innerHTML = "";
        if (snap.empty) { ul.appendChild(el("li", null, "No updates yet.")); return; }
        snap.forEach(function (d) {
          var h = d.data();
          var li = el("li", null, label(h.status));
          if (h.note) li.appendChild(el("small", null, h.note));
          li.appendChild(el("small", null, fmt(h.at)));
          ul.appendChild(li);
        });
      }, function (err) {
        console.error("History error:", err);
        var ul = $("tl-" + rx);
        if (ul) { ul.innerHTML = ""; ul.appendChild(el("li", null, "Could not load progress.")); }
      });
  }

  async function loadImage(rx, btn, img) {
    btn.disabled = true;
    btn.textContent = "Loading photo...";
    try {
      var snap = await fdb.collection("prescriptions").doc(rx).collection("files").doc("main").get();
      if (!snap.exists) { btn.textContent = "Photo not found"; return; }
      var f = snap.data();
      img.src = "data:" + (f.fileType || "image/jpeg") + ";base64," + f.data;
      img.style.display = "block";
      btn.textContent = "Photo loaded";
    } catch (e) {
      console.error("Photo error:", e);
      btn.disabled = false;
      btn.textContent = "Could not load photo. Tap to retry";
    }
  }

  /* ---------- list ---------- */
  function render(docs) {
    var list = $("rxList");
    list.innerHTML = "";
    if (!docs.length) {
      list.appendChild(el("div", "empty", "You have not uploaded any prescription yet."));
      return;
    }
    docs.forEach(function (d) {
      var data = d.data();
      var id = d.id;
      var card = el("div", "rx-card");

      var top = el("div", "rx-top");
      var left = el("div");
      left.appendChild(el("div", "rx-id", "RX-" + id.slice(-6).toUpperCase()));
      left.appendChild(el("div", "rx-date", fmt(data.createdAt)));
      top.appendChild(left);
      top.appendChild(el("span", badgeClass(data.status), label(data.status)));
      card.appendChild(top);

      if (openId === id) card.appendChild(buildDetails(id, data));

      top.addEventListener("click", function () {
        if (stopHistory) { stopHistory(); stopHistory = null; }
        openId = (openId === id) ? null : id;
        render(lastDocs);
        if (openId) watchHistory(openId);
      });
      list.appendChild(card);
    });
  }

  function start() {
    if (started) return;
    started = true;
    var uid = window.faxCustomer.uid;
    fdb.collection("prescriptions").where("customerId", "==", uid)
      .onSnapshot(function (snap) {
        lastDocs = snap.docs.slice().sort(function (a, b) {
          return secs(b.data().createdAt) - secs(a.data().createdAt);
        });
        $("rxMsg").hidden = true;
        var keepHistory = openId;
        render(lastDocs);
        if (keepHistory && !stopHistory) watchHistory(keepHistory);
      }, function (err) {
        console.error("Prescriptions error:", err);
        showMsg("Could not load your prescriptions. Please check your internet and refresh.", "error");
      });
  }

  if (window.faxCustomer) start();
  else document.addEventListener("fax-customer-ready", start);
})();
</script>
</body>
</html>

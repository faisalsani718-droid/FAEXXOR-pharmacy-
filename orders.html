<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#0284C7">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Orders - FX PHARMARKET</title>
  <style>
    :root { --deep:#0284C7; --sky:#38BDF8; --green:#A7E8C0; --fresh:#86D9A7; --soft:#F5FAFF; --text:#3b5b6e; --ink:#17435a; --line:rgba(56,189,248,.30);
            --shadow:0 10px 34px rgba(2,132,199,.10), 0 2px 8px rgba(134,217,167,.18); --shadow-up:0 20px 44px rgba(2,132,199,.20), 0 6px 14px rgba(134,217,167,.26); }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Manrope, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; color: var(--text); line-height: 1.55; -webkit-font-smoothing: antialiased;
           background: radial-gradient(700px 420px at 100% -4%, rgba(167,232,192,.50), transparent 62%), radial-gradient(760px 460px at -10% 4%, rgba(56,189,248,.20), transparent 62%), var(--soft);
           background-attachment: fixed; padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px)); }
    :focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; border-radius: 10px; }
    header { position: sticky; top: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top, 0px));
             background: rgba(255,255,255,.82); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
    header h1 { margin: 0; font-size: 1.1rem; font-weight: 800; color: var(--deep); }
    header a { color: var(--deep); background: #fff; text-decoration: none; font-weight: 800; padding: 9px 15px; border-radius: 999px; font-size: .88rem; white-space: nowrap; border: 1px solid var(--line); transition: transform .3s, box-shadow .3s; }
    header a:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    .intro { font-size: .95rem; margin: 4px 0 16px; }

    .order { background: #fff; border: 1px solid var(--line); border-radius: 26px; padding: 20px 18px; margin-bottom: 16px; box-shadow: var(--shadow); transition: transform .4s, box-shadow .4s; }
    .order:hover { transform: translateY(-3px); box-shadow: var(--shadow-up); }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .oid { font-weight: 800; font-size: 1.05rem; color: var(--deep); }
    .date { font-size: .82rem; margin-top: 2px; }
    .badge { font-size: .74rem; font-weight: 800; padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
    .b-pending { background: #e1f3fd; color: #0369a1; }
    .b-accepted { background: var(--sky); color: #fff; }
    .b-packaging { background: var(--green); color: #2c5a46; }
    .b-out_for_delivery { background: var(--fresh); color: #1f4d3a; }
    .b-delivered { background: var(--deep); color: #fff; }
    .b-unknown { background: #e9eef3; color: #4a5560; }
    .b-rejected { background: #fdecec; color: #8f3b3b; }

    .msg { margin: 12px 0; padding: 12px 14px; background: var(--soft); border: 1px solid var(--line); border-left: 4px solid var(--sky); border-radius: 14px; font-size: .92rem; color: var(--ink); }
    .msg.bad { background: #fdf1f1; border-color: #efc3c3; border-left-color: #b64a4a; }
    .msg.good { background: rgba(167,232,192,.28); border-color: var(--green); border-left-color: var(--fresh); }

    .pay { margin: 12px 0; padding: 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--soft); }
    .pay strong { display: block; color: var(--deep); }
    .pay p { margin: 4px 0 0; font-size: .88rem; }
    .pay.ok { background: rgba(167,232,192,.30); border-color: var(--green); }
    .pay.bad { background: #fdf1f1; border-color: #efc3c3; }
    .pay.bad strong { color: #8f3b3b; }
    .pay button { margin-top: 10px; }

    .track { list-style: none; margin: 14px 0; padding: 0; }
    .track li { position: relative; padding: 0 0 16px 34px; font-size: .92rem; color: #8fa7b6; }
    .track li:last-child { padding-bottom: 0; }
    .track li::before { content: ""; position: absolute; left: 7px; top: 20px; bottom: -2px; width: 2px; background: rgba(56,189,248,.3); }
    .track li:last-child::before { display: none; }
    .track li .dot { position: absolute; left: 0; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 2px solid #b6cddb; }
    .track li.done { color: var(--ink); }
    .track li.done .dot { background: var(--fresh); border-color: var(--fresh); }
    .track li.done::before { background: var(--fresh); }
    .track li.now { color: var(--deep); font-weight: 800; }
    .track li.now .dot { background: var(--deep); border-color: var(--deep); box-shadow: 0 0 0 4px rgba(56,189,248,.25); }
    .track small { display: block; font-weight: 500; color: var(--text); font-size: .78rem; }

    details { margin-top: 12px; border-top: 1px solid rgba(56,189,248,.25); padding-top: 10px; }
    summary { cursor: pointer; font-weight: 800; color: var(--deep); font-size: .93rem; }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: .92rem; }
    .row span:last-child { text-align: right; }
    .total { border-top: 1px dashed rgba(2,132,199,.35); margin-top: 6px; padding-top: 8px; font-weight: 800; color: var(--deep); }

    .empty { text-align: center; padding: 40px 16px; background: #fff; border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow); }
    .empty a, .btn { display: inline-block; margin-top: 12px; background: var(--deep); color: #fff; text-decoration: none; padding: 13px 22px; border-radius: 16px; font-weight: 800; font-family: inherit;
                     box-shadow: 0 10px 22px rgba(2,132,199,.28); transition: transform .3s, box-shadow .3s; }
    .empty a:hover, .btn:hover { transform: translateY(-2px); box-shadow: 0 16px 30px rgba(2,132,199,.38); }
    .state { text-align: center; padding: 30px 10px; }
  </style>
</head>
<body>

<header>
  <h1>My Orders</h1>
  <a href="index.html">Back to website</a>
</header>

<main>
  <p class="intro">Track your orders live. This page updates by itself when the pharmacy changes your order status.</p>
  <div id="list"><p class="state">Loading your orders...</p></div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<script src="firebase.js"></script>
<script>
(function () {
  var listEl = document.getElementById("list");
  var unsub = null;

  var STEPS = [
    { key: "pending",          label: "Order placed",      field: "createdAt" },
    { key: "accepted",         label: "Order accepted",    field: "acceptedAt" },
    { key: "packaging",        label: "Packaging",         field: "packagingAt" },
    { key: "out_for_delivery", label: "Out for delivery",  field: "out_for_deliveryAt" },
    { key: "delivered",        label: "Delivered",         field: "deliveredAt" }
  ];
  var LABEL = {
    pending: "Pending", accepted: "Accepted", packaging: "Packaging",
    out_for_delivery: "Out for delivery", delivered: "Delivered", rejected: "Rejected"
  };
  var TEXT = {
    pending: "We received your order. It is waiting for confirmation from the pharmacy.",
    accepted: "Good news! Your order has been accepted.",
    packaging: "Your medicines are being packed now.",
    out_for_delivery: "Your order is on its way to you.",
    delivered: "Your order was delivered. Thank you for choosing FX PHARMARKET.",
    rejected: "Sorry, the pharmacy could not accept this order. Please contact us for help."
  };

  function fxFn(name, data) { return firebase.app().functions("us-central1").httpsCallable(name)(data); }

  function mk(tag, text, cls) {
    var e = document.createElement(tag);
    if (text !== undefined && text !== null) e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }
  function money(n) { return "\u20A6" + Number(n || 0).toLocaleString(); }
  function when(ts) {
    try { return ts && ts.toDate ? ts.toDate().toLocaleString() : ""; } catch (e) { return ""; }
  }
  function row(box, a, b, cls) {
    var r = mk("div", null, "row" + (cls ? " " + cls : ""));
    r.appendChild(mk("span", a));
    r.appendChild(mk("span", b));
    box.appendChild(r);
  }

  // Maps older/variant status values (e.g. "Accept") to the standard ones. Database is not changed.
  var ALIAS = {
    pending: "pending", accept: "accepted", accepted: "accepted",
    packing: "packaging", packed: "packaging", packaging: "packaging",
    "out for delivery": "out_for_delivery", out_for_delivery: "out_for_delivery",
    "on delivery": "out_for_delivery", shipped: "out_for_delivery",
    delivered: "delivered", reject: "rejected", rejected: "rejected"
  };
  function norm(s) {
    if (s === undefined || s === null || String(s).trim() === "") return "pending";
    var k = String(s).trim().toLowerCase().replace(/[\s-]+/g, " ");
    return ALIAS[k] || ALIAS[k.replace(/ /g, "_")] || null;
  }

  function card(d) {
    var o = d.data();
    var st = norm(o.status);
    var c = mk("div", null, "order");

    var top = mk("div", null, "top");
    var left = mk("div");
    left.appendChild(mk("div", "Order FX-" + d.id.slice(-6).toUpperCase(), "oid"));
    left.appendChild(mk("div", when(o.createdAt), "date"));
    top.appendChild(left);
    top.appendChild(mk("span", st ? LABEL[st] : String(o.status), "badge b-" + (st || "unknown")));
    c.appendChild(top);

    c.appendChild(mk("div", TEXT[st] || "The pharmacy is updating your order status.", "msg" + (st === "rejected" ? " bad" : st === "delivered" ? " good" : "")));

    // OPay payment status (the server is the only thing that can mark an order paid)
    if (o.paymentMethod === "OPay" && st !== "rejected") {
      var ps = String(o.paymentStatus || "").toLowerCase();
      var verified = ps === "paid" && o.paymentVerified === true;
      var pb = mk("div", null, "pay " + (verified ? "ok" : (ps === "failed" || ps === "cancelled") ? "bad" : ""));
      if (verified) {
        pb.appendChild(mk("strong", "\u2713 Payment verified"));
        pb.appendChild(mk("p", "We confirmed your OPay payment. Thank you."));
      } else if (ps === "pending") {
        pb.appendChild(mk("strong", "Confirming your payment"));
        pb.appendChild(mk("p", "If you already paid, please wait a moment. We confirm automatically. Do not pay again."));
        var chk = mk("button", "Check payment status", "btn");
        chk.type = "button"; chk.style.cssText = "border:0;cursor:pointer";
        chk.onclick = function () {
          chk.disabled = true; chk.textContent = "Checking...";
          fxFn("verifyOpayPayment", { orderId: d.id }).then(function () { toast("Payment status refreshed"); })
            .catch(function () { toast("Could not check right now. Please try again."); })
            .then(function () { chk.disabled = false; chk.textContent = "Check payment status"; });
        };
        pb.appendChild(chk);
      } else if (ps === "review") {
        pb.appendChild(mk("strong", "Payment under review"));
        pb.appendChild(mk("p", "Our team is checking your payment. Please contact us with your order number if it takes long."));
      } else {
        pb.appendChild(mk("strong", ps === "failed" ? "Payment failed" : ps === "cancelled" ? "Payment cancelled" : "Payment not completed"));
        pb.appendChild(mk("p", "Your order is saved. Complete the payment with OPay to continue."));
        var go = mk("button", "Pay with OPay", "btn");
        go.type = "button"; go.style.cssText = "border:0;cursor:pointer";
        go.onclick = function () {
          go.disabled = true; go.textContent = "Opening OPay...";
          fxFn("startOpayPayment", { orderId: d.id }).then(function (r) {
            var url = r && r.data && r.data.cashierUrl;
            if (url && url.indexOf("https://") === 0) location.href = url; else throw new Error("no url");
          }).catch(function () { go.disabled = false; go.textContent = "Pay with OPay"; toast("Could not open OPay. Please try again."); });
        };
        pb.appendChild(go);
      }
      c.appendChild(pb);
    }

    if (st && st !== "rejected") {
      var ul = mk("ul", null, "track");
      var idx = 0;
      STEPS.forEach(function (s, i) { if (s.key === st) idx = i; });
      STEPS.forEach(function (s, i) {
        var li = mk("li", null, i < idx || (st === "delivered" && i === idx) ? "done" : i === idx ? "now" : "");
        li.appendChild(mk("span", null, "dot"));
        li.appendChild(document.createTextNode(s.label));
        var t = when(o[s.field]);
        if (t && i <= idx) li.appendChild(mk("small", t));
        ul.appendChild(li);
      });
      c.appendChild(ul);
    }

    // Rider details (shown only after the admin saved them)
    if (o.riderName && (st === "out_for_delivery" || st === "delivered")) {
      var rb = mk("div", null, "msg");
      rb.appendChild(mk("strong", "Delivery rider: "));
      rb.appendChild(document.createTextNode(o.riderName + " "));
      var tel = String(o.riderPhone || "").replace(/[^\d+]/g, "");
      if (tel) { var ta = mk("a", o.riderPhone); ta.href = "tel:" + tel; rb.appendChild(ta); }
      if (o.estimatedDelivery) rb.appendChild(mk("div", "Estimated delivery: " + o.estimatedDelivery));
      c.appendChild(rb);
    }

    // Customer confirms receipt after the admin marks Delivered
    if (st === "delivered") {
      var fbId = "FX-" + d.id.slice(-6).toUpperCase();   // same order number the admin sees
      if (o.customerConfirmed) {
        c.appendChild(mk("div", "You confirmed receipt " + when(o.customerConfirmedAt) + ". Thank you!", "msg good"));
        var rated = false;
        try { rated = !!localStorage.getItem("fx_fb_" + fbId); } catch (e) {}
        if (rated) {
          c.appendChild(mk("div", "Thank you for rating your delivery. \u2605", "msg good"));
        } else {
          var rateBtn = mk("a", "\u2605 Rate your delivery", "btn");
          rateBtn.href = "feedback.html?order=" + encodeURIComponent(fbId);
          rateBtn.style.cssText = "width:100%;text-align:center;box-sizing:border-box;margin-top:6px;font-size:1rem";
          c.appendChild(rateBtn);
        }
      } else {
        var cb = mk("button", "I RECEIVED MY ORDER", "btn");
        cb.type = "button";
        cb.style.cssText = "border:0;cursor:pointer;width:100%;margin-top:6px;font-size:1rem";
        cb.onclick = function () {
          if (!confirm("Confirm that you received this order?")) return;
          cb.disabled = true;
          d.ref.update({
            customerConfirmed: true,
            customerConfirmedAt: firebase.firestore.FieldValue.serverTimestamp()
          }).then(function () {
            location.href = "feedback.html?order=" + encodeURIComponent(fbId);   // ask for the stars right away
          }).catch(function () { cb.disabled = false; alert("Could not confirm. Please try again."); });
        };
        c.appendChild(cb);
      }
    }

    // receipt for this order (the receipt page checks that the order belongs to this customer)
    if (st !== "rejected") {
      var rc = mk("a", "\uD83E\uDDFE View receipt");
      rc.href = "receipt.html?id=" + encodeURIComponent(d.id);
      rc.style.cssText = "display:block;text-align:center;margin-top:12px;padding:12px;border-radius:10px;background:#e1f3fd;color:#0284C7;font-weight:800;border:1px solid rgba(56,189,248,.30);text-decoration:none";
      c.appendChild(rc);
    }

    var det = document.createElement("details");
    det.appendChild(mk("summary", "View order details"));
    (Array.isArray(o.items) ? o.items : []).forEach(function (it) {
      var name = it.name || it.medicineName || it.title || it.productName || "Item";
      var qty = it.quantity !== undefined ? it.quantity : it.qty;
      row(det, name + (qty ? " x" + qty : ""), money(it.price));
    });
    row(det, "Total", money(o.totalPrice), "total");
    row(det, "Payment", o.paymentMethod || "-");
    row(det, "Delivery address", o.address || o.deliveryAddress || "-");
    c.appendChild(det);
    return c;
  }

  var seen = {};
  function toast(t) {
    var n = mk("div", t);
    n.style.cssText = "position:fixed;left:12px;right:12px;bottom:90px;background:#0284C7;color:#fff;padding:14px 16px;border-radius:16px;box-shadow:0 12px 30px rgba(2,132,199,.35);z-index:99;font-weight:700";
    document.body.appendChild(n);
    setTimeout(function () { n.remove(); }, 6000);
  }

  function render(snap) {
    snap.docs.forEach(function (d) {
      var s = norm(d.data().status);
      if (seen[d.id] !== undefined && seen[d.id] !== s) {
        toast("Order FX-" + d.id.slice(-6).toUpperCase() + " is now: " + (s ? LABEL[s] : "updated"));
      }
      seen[d.id] = s;
    });
    listEl.innerHTML = "";
    if (snap.empty) {
      var e = mk("div", null, "empty");
      e.appendChild(mk("h3", "No orders yet"));
      e.appendChild(mk("p", "When you place an order, you can track it here."));
      var a = mk("a", "Browse Medicines");
      a.href = "index.html#products";
      e.appendChild(a);
      listEl.appendChild(e);
      return;
    }
    snap.docs.slice().sort(function (a, b) {
      var x = a.data().createdAt, y = b.data().createdAt;
      return (y && y.toMillis ? y.toMillis() : 0) - (x && x.toMillis ? x.toMillis() : 0);
    }).forEach(function (d) { listEl.appendChild(card(d)); });
  }

  function needLogin() {
    listEl.innerHTML = "";
    var e = mk("div", null, "empty");
    e.appendChild(mk("h3", "Please log in"));
    e.appendChild(mk("p", "Log in to see your orders."));
    var a = mk("a", "Login");
    a.href = "login.html";
    e.appendChild(a);
    listEl.appendChild(e);
  }

  try {
    firebase.auth().onAuthStateChanged(function (user) {
      if (unsub) { unsub(); unsub = null; }
      if (!user) { needLogin(); return; }
      unsub = firebase.firestore().collection("orders")
        .where("customerId", "==", user.uid)
        .onSnapshot(render, function (err) {
          console.error(err);
          listEl.innerHTML = "";
          listEl.appendChild(mk("p", "Unable to load your orders. Please try again.", "state"));
        });
    });
  } catch (e) {
    listEl.innerHTML = "";
    listEl.appendChild(mk("p", "Page could not start. Open it from http://localhost and check firebase.js.", "state"));
  }
})();
</script>
<script src="bottom-nav.js"></script>
</body>
</html>

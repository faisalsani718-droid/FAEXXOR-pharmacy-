<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Orders - FAEXXOR Pharmacy</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, Arial, sans-serif; background: #f3f6fa; color: #1b2733; }
    header { background: linear-gradient(90deg, #0b4a9e, #04a0e0); color: #fff; padding: 16px 18px;
             display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    header h1 { margin: 0; font-size: 1.1rem; }
    header a { color: #0b4a9e; background: #fff; text-decoration: none; font-weight: 600;
               padding: 9px 14px; border-radius: 8px; font-size: .9rem; white-space: nowrap; }
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    .intro { color: #5b6b7a; font-size: .95rem; margin: 4px 0 16px; }

    .order { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 16px;
             box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .oid { font-weight: 700; font-size: 1.02rem; color: #0b4a9e; }
    .date { font-size: .82rem; color: #6b7b8a; margin-top: 2px; }
    .badge { font-size: .74rem; font-weight: 700; padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
    .b-pending { background: #fff3cd; color: #8a6200; }
    .b-accepted { background: #d9ecff; color: #0b4a9e; }
    .b-packaging { background: #e5dcff; color: #4b2fa0; }
    .b-out_for_delivery { background: #ffe8cc; color: #a85a00; }
    .b-delivered { background: #d6f5e3; color: #137a3d; }
    .b-unknown { background: #e9eef3; color: #4a5560; }
    .b-rejected { background: #fde0e0; color: #b3261e; }

    .msg { margin: 12px 0; padding: 10px 12px; background: #f3f8ff; border-left: 4px solid #0b4a9e;
           border-radius: 6px; font-size: .93rem; }
    .msg.bad { background: #fff3f3; border-left-color: #b3261e; }
    .msg.good { background: #f1fbf5; border-left-color: #137a3d; }

    .track { list-style: none; margin: 14px 0; padding: 0; }
    .track li { position: relative; padding: 0 0 16px 34px; font-size: .92rem; color: #9aa8b5; }
    .track li:last-child { padding-bottom: 0; }
    .track li::before { content: ""; position: absolute; left: 7px; top: 20px; bottom: -2px; width: 2px; background: #dbe3ec; }
    .track li:last-child::before { display: none; }
    .track li .dot { position: absolute; left: 0; top: 2px; width: 16px; height: 16px; border-radius: 50%;
                     background: #fff; border: 2px solid #c5d0dc; }
    .track li.done { color: #1b2733; }
    .track li.done .dot { background: #137a3d; border-color: #137a3d; }
    .track li.done::before { background: #137a3d; }
    .track li.now { color: #0b4a9e; font-weight: 700; }
    .track li.now .dot { background: #0b4a9e; border-color: #0b4a9e; box-shadow: 0 0 0 4px rgba(11,74,158,.2); }
    .track small { display: block; font-weight: 400; color: #6b7b8a; font-size: .78rem; }

    details { margin-top: 12px; border-top: 1px solid #e6ecf2; padding-top: 10px; }
    summary { cursor: pointer; font-weight: 600; color: #0b4a9e; font-size: .93rem; }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: .92rem; }
    .row span:last-child { text-align: right; }
    .total { border-top: 1px dashed #cfd8e3; margin-top: 6px; padding-top: 8px; font-weight: 700; }

    .empty { text-align: center; padding: 40px 16px; background: #fff; border-radius: 14px; }
    .empty a, .btn { display: inline-block; margin-top: 12px; background: #0b4a9e; color: #fff; text-decoration: none;
                     padding: 11px 20px; border-radius: 10px; font-weight: 600; }
    .state { text-align: center; color: #5b6b7a; padding: 30px 10px; }
  </style>
</head>
<body>

<header>
  <h1>My Orders</h1>
  <a href="index.html">Back to website</a>
</header>

<main>
  <p class="intro">Track your orders live. This page updates by itself when the pharmacy changes your order status.</p>
  <div id="list"><p class="state">Loading your orders...</p></div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<script>
(function () {
  var listEl = document.getElementById("list");
  var unsub = null;

  var STEPS = [
    { key: "pending",          label: "Order placed",      field: "createdAt" },
    { key: "accepted",         label: "Order accepted",    field: "acceptedAt" },
    { key: "packaging",        label: "Packaging",         field: "packagingAt" },
    { key: "out_for_delivery", label: "Out for delivery",  field: "out_for_deliveryAt" },
    { key: "delivered",        label: "Delivered",         field: "deliveredAt" }
  ];
  var LABEL = {
    pending: "Pending", accepted: "Accepted", packaging: "Packaging",
    out_for_delivery: "Out for delivery", delivered: "Delivered", rejected: "Rejected"
  };
  var TEXT = {
    pending: "We received your order. It is waiting for confirmation from the pharmacy.",
    accepted: "Good news! Your order has been accepted.",
    packaging: "Your medicines are being packed now.",
    out_for_delivery: "Your order is on its way to you.",
    delivered: "Your order was delivered. Thank you for choosing FAEXXOR Pharmacy.",
    rejected: "Sorry, the pharmacy could not accept this order. Please contact us for help."
  };

  function mk(tag, text, cls) {
    var e = document.createElement(tag);
    if (text !== undefined && text !== null) e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }
  function money(n) { return "\u20A6" + Number(n || 0).toLocaleString(); }
  function when(ts) {
    try { return ts && ts.toDate ? ts.toDate().toLocaleString() : ""; } catch (e) { return ""; }
  }
  function row(box, a, b, cls) {
    var r = mk("div", null, "row" + (cls ? " " + cls : ""));
    r.appendChild(mk("span", a));
    r.appendChild(mk("span", b));
    box.appendChild(r);
  }

  // Maps older/variant status values (e.g. "Accept") to the standard ones. Database is not changed.
  var ALIAS = {
    pending: "pending", accept: "accepted", accepted: "accepted",
    packing: "packaging", packed: "packaging", packaging: "packaging",
    "out for delivery": "out_for_delivery", out_for_delivery: "out_for_delivery",
    "on delivery": "out_for_delivery", shipped: "out_for_delivery",
    delivered: "delivered", reject: "rejected", rejected: "rejected"
  };
  function norm(s) {
    if (s === undefined || s === null || String(s).trim() === "") return "pending";
    var k = String(s).trim().toLowerCase().replace(/[\s-]+/g, " ");
    return ALIAS[k] || ALIAS[k.replace(/ /g, "_")] || null;
  }

  function card(d) {
    var o = d.data();
    var st = norm(o.status);
    var c = mk("div", null, "order");

    var top = mk("div", null, "top");
    var left = mk("div");
    left.appendChild(mk("div", "Order FX-" + d.id.slice(-6).toUpperCase(), "oid"));
    left.appendChild(mk("div", when(o.createdAt), "date"));
    top.appendChild(left);
    top.appendChild(mk("span", st ? LABEL[st] : String(o.status), "badge b-" + (st || "unknown")));
    c.appendChild(top);

    c.appendChild(mk("div", TEXT[st] || "The pharmacy is updating your order status.", "msg" + (st === "rejected" ? " bad" : st === "delivered" ? " good" : "")));

    if (st && st !== "rejected") {
      var ul = mk("ul", null, "track");
      var idx = 0;
      STEPS.forEach(function (s, i) { if (s.key === st) idx = i; });
      STEPS.forEach(function (s, i) {
        var li = mk("li", null, i < idx || (st === "delivered" && i === idx) ? "done" : i === idx ? "now" : "");
        li.appendChild(mk("span", null, "dot"));
        li.appendChild(document.createTextNode(s.label));
        var t = when(o[s.field]);
        if (t && i <= idx) li.appendChild(mk("small", t));
        ul.appendChild(li);
      });
      c.appendChild(ul);
    }

    // Rider details (shown only after the admin saved them)
    if (o.riderName && (st === "out_for_delivery" || st === "delivered")) {
      var rb = mk("div", null, "msg");
      rb.appendChild(mk("strong", "Delivery rider: "));
      rb.appendChild(document.createTextNode(o.riderName + " "));
      var tel = String(o.riderPhone || "").replace(/[^\d+]/g, "");
      if (tel) { var ta = mk("a", o.riderPhone); ta.href = "tel:" + tel; rb.appendChild(ta); }
      if (o.estimatedDelivery) rb.appendChild(mk("div", "Estimated delivery: " + o.estimatedDelivery));
      c.appendChild(rb);
    }

    // Customer confirms receipt after the admin marks Delivered
    if (st === "delivered") {
      if (o.customerConfirmed) {
        c.appendChild(mk("div", "You confirmed receipt " + when(o.customerConfirmedAt) + ". Thank you!", "msg good"));
      } else {
        var cb = mk("button", "I RECEIVED MY ORDER", "btn");
        cb.type = "button";
        cb.style.cssText = "border:0;cursor:pointer;width:100%;margin-top:6px;font-size:1rem";
        cb.onclick = function () {
          if (!confirm("Confirm that you received this order?")) return;
          cb.disabled = true;
          d.ref.update({
            customerConfirmed: true,
            customerConfirmedAt: firebase.firestore.FieldValue.serverTimestamp()
          }).catch(function () { cb.disabled = false; alert("Could not confirm. Please try again."); });
        };
        c.appendChild(cb);
      }
    }

    var det = document.createElement("details");
    det.appendChild(mk("summary", "View order details"));
    (Array.isArray(o.items) ? o.items : []).forEach(function (it) {
      var name = it.name || it.medicineName || it.title || it.productName || "Item";
      var qty = it.quantity !== undefined ? it.quantity : it.qty;
      row(det, name + (qty ? " x" + qty : ""), money(it.price));
    });
    row(det, "Total", money(o.totalPrice), "total");
    row(det, "Payment", o.paymentMethod || "-");
    row(det, "Delivery address", o.address || o.deliveryAddress || "-");
    c.appendChild(det);
    return c;
  }

  var seen = {};
  function toast(t) {
    var n = mk("div", t);
    n.style.cssText = "position:fixed;left:12px;right:12px;bottom:90px;background:#0b4a9e;color:#fff;padding:14px 16px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:99;font-weight:600";
    document.body.appendChild(n);
    setTimeout(function () { n.remove(); }, 6000);
  }

  function render(snap) {
    snap.docs.forEach(function (d) {
      var s = norm(d.data().status);
      if (seen[d.id] !== undefined && seen[d.id] !== s) {
        toast("Order FX-" + d.id.slice(-6).toUpperCase() + " is now: " + (s ? LABEL[s] : "updated"));
      }
      seen[d.id] = s;
    });
    listEl.innerHTML = "";
    if (snap.empty) {
      var e = mk("div", null, "empty");
      e.appendChild(mk("h3", "No orders yet"));
      e.appendChild(mk("p", "When you place an order, you can track it here."));
      var a = mk("a", "Browse Medicines");
      a.href = "index.html#products";
      e.appendChild(a);
      listEl.appendChild(e);
      return;
    }
    snap.docs.slice().sort(function (a, b) {
      var x = a.data().createdAt, y = b.data().createdAt;
      return (y && y.toMillis ? y.toMillis() : 0) - (x && x.toMillis ? x.toMillis() : 0);
    }).forEach(function (d) { listEl.appendChild(card(d)); });
  }

  function needLogin() {
    listEl.innerHTML = "";
    var e = mk("div", null, "empty");
    e.appendChild(mk("h3", "Please log in"));
    e.appendChild(mk("p", "Log in to see your orders."));
    var a = mk("a", "Login");
    a.href = "_login.html";
    e.appendChild(a);
    listEl.appendChild(e);
  }

  try {
    firebase.auth().onAuthStateChanged(function (user) {
      if (unsub) { unsub(); unsub = null; }
      if (!user) { needLogin(); return; }
      unsub = firebase.firestore().collection("orders")
        .where("customerId", "==", user.uid)
        .onSnapshot(render, function (err) {
          console.error(err);
          listEl.innerHTML = "";
          listEl.appendChild(mk("p", "Unable to load your orders. Please try again.", "state"));
        });
    });
  } catch (e) {
    listEl.innerHTML = "";
    listEl.appendChild(mk("p", "Page could not start. Open it from http://localhost and check firebase.js.", "state"));
  }
})();
</script>
<script src="bottom-nav.js"></script>
</body>
</html>

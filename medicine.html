<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FAEXXOR Pharmacy</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{--blue:#0878d1;--sky:#00bfff;--mint:#eef6fc;--ink:#1c2321;--muted:#66726e;--line:#dde5ea;--red:#e5383b;--amber:#b86e00}
  *{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body{color:var(--ink);background:#fff;max-width:520px;margin:0 auto;padding-bottom:84px}
  .back{display:block;padding:14px 16px;color:var(--blue);font-weight:700;text-decoration:none}
  .main-img{width:100%;aspect-ratio:1/1;object-fit:contain;display:block;background:var(--mint)}
  .gal{position:relative}
  .counter{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.92);padding:4px 10px;border-radius:99px;font-size:13px;font-weight:600}
  .thumbs{display:flex;gap:8px;padding:10px 12px;overflow-x:auto}
  .thumbs img{width:60px;height:60px;object-fit:cover;border-radius:8px;border:2px solid transparent;background:var(--mint);flex:none;cursor:pointer}
  .thumbs img.on{border-color:var(--ink)}
  section{padding:8px 16px 12px}
  h1{font-size:19px;line-height:1.3}
  .meta{margin-top:8px;font-size:14px;color:var(--muted)}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .badge{font-size:13px;padding:5px 10px;border-radius:6px;background:var(--mint);color:var(--blue);font-weight:600}
  .badge.rx,.badge.out{background:#fdecea;color:var(--red)}
  .badge.low{background:#fff3df;color:var(--amber)}
  .opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .opts button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;text-align:left}
  .opts button small{display:block;font-weight:400;color:var(--muted)}
  .opts button.on{border-color:var(--blue);background:var(--mint)}
  .price-box{margin:8px 16px 0;border:2px solid var(--red);border-radius:12px;overflow:hidden}
  .price-box .tag{background:var(--red);color:#fff;font-weight:700;padding:8px 12px;font-size:15px}
  .price-box .body{padding:12px}
  .price{font-size:30px;font-weight:800}
  .tier{margin-top:6px;color:#1b6b3d;font-size:15px}
  .gap{height:8px;background:var(--mint);margin-top:12px}
  .row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
  .row:last-child{border:0}
  h2{font-size:18px;padding:16px 16px 4px}
  details{border-bottom:1px solid var(--line);padding:0 16px}
  summary{list-style:none;padding:14px 0;font-weight:600;display:flex;justify-content:space-between;cursor:pointer}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";font-size:20px;color:var(--muted)}
  details[open] summary::after{content:"\2212"}
  details p{padding:0 0 14px;line-height:1.55;color:#38433f;font-size:15px}
  .bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-top:1px solid var(--line);display:flex;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
  .bar button{flex:1;height:50px;border-radius:99px;font-size:16px;font-weight:700;cursor:pointer}
  .cart{background:#fff;border:2px solid var(--ink);color:var(--ink)}
  .buy{background:var(--red);border:0;color:#fff}
  .bar button:disabled{opacity:.45;cursor:not-allowed}
  .note{padding:40px 16px;text-align:center;color:var(--muted)}
  button:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .top{display:flex;justify-content:space-between;align-items:center;padding-right:16px}
  .cartlink{position:relative;color:var(--ink);font-size:22px;text-decoration:none;padding:8px}
  #cbadge{position:absolute;top:0;right:-2px;min-width:18px;height:18px;border-radius:99px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:none;place-items:center;padding:0 4px}
  .toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:#1c2321;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:.25s;z-index:20;white-space:nowrap}
  .toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .toast a{color:#7fd4ff;font-weight:700;text-decoration:none}
  .sk{background:linear-gradient(90deg,#eef2f5 25%,#f7f9fb 50%,#eef2f5 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px}
  @keyframes sk{to{background-position:-200% 0}}
  @media (prefers-reduced-motion:reduce){.sk{animation:none}.toast{transition:none}}
</style>
</head>
<body>
<div class="top"><a class="back" href="index.html#products">&#8249; All products</a><a class="cartlink" href="index.html?cart=1" aria-label="Open cart"><i class="fa-solid fa-cart-shopping"></i><span id="cbadge">0</span></a></div>
<div id="app"><div class="sk" style="aspect-ratio:1/1"></div><div style="padding:16px"><div class="sk" style="height:22px;width:80%"></div><div class="sk" style="height:16px;width:50%;margin-top:12px"></div><div class="sk" style="height:70px;margin-top:20px"></div></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<script src="cart-store.js"></script>
<script>
(function(){
  "use strict";
  var app = document.getElementById("app");
  var money = function(n){return "\u20A6" + Number(n||0).toLocaleString("en-NG");};
  var esc = function(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};
  var slug = function(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");};
  var PH = "data:image/svg+xml," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'><rect width='400' height='400' fill='#eef6fc'/><rect x='130' y='170' width='140' height='60' rx='30' fill='#0878d1'/><rect x='200' y='170' width='70' height='60' rx='30' fill='#fff'/></svg>");
  var low = 5, variants = [], vi = 0, imgs = [];

  var id = new URLSearchParams(location.search).get("id");
  if (!id) { app.innerHTML = '<p class="note">Product not found.</p>'; return; }
  if (typeof db === "undefined") { var db = firebase.firestore(); }

  db.collection("products").doc(id).get().then(function(d){
    if (!d.exists) throw new Error("missing");
    var base = d.data(); base.id = d.id;
    return db.collection("products").where("name","==",base.name).where("active","==",true).get().then(function(q){
      variants = q.docs.map(function(x){var o=x.data();o.id=x.id;return o;});
      if (!variants.some(function(v){return v.id===base.id;})) variants.unshift(base);
      vi = Math.max(0, variants.findIndex(function(v){return v.id===base.id;}));
      draw();
    });
  }).catch(function(e){ console.error(e); app.innerHTML = '<p class="note">Could not load this medicine. <a href="index.html#products">Back to products</a></p>'; });

  function gallery(v){
    var list = [];
    if (v.image) list.push(v.image);
    if (Array.isArray(v.images)) v.images.forEach(function(u){ if (list.indexOf(u)<0) list.push(u); });
    if (Array.isArray(v.extraImages)) v.extraImages.forEach(function(u){ if (list.indexOf(u)<0) list.push(u); });
    if (!list.length) list.push("images/" + slug(v.name + (v.variantLabel ? " " + v.variantLabel : "")) + ".jpg");
    return list;
  }
  function section(title, text, open){
    return text ? '<details '+(open?"open":"")+'><summary>'+title+'</summary><p>'+esc(text)+'</p></details>' : "";
  }
  function draw(){
    var v = variants[vi], stock = Number.isInteger(v.stockQuantity) ? v.stockQuantity : null;
    var out = stock !== null && stock <= 0, lowS = stock !== null && stock > 0 && stock <= low;
    var expired = v.expiryDate && new Date(v.expiryDate) < new Date();
    var cant = out || expired;
    imgs = gallery(v);
    document.title = v.name + " | FAEXXOR Pharmacy";
    var opts = variants.length > 1 ? '<div class="opts">' + variants.map(function(x,i){
      return '<button type="button" data-v="'+i+'" class="'+(i===vi?"on":"")+'">'+esc(x.variantLabel||x.name)+'<small>'+money(x.price)+'</small></button>';
    }).join("") + '</div>' : "";
    var info = [v.dosageForm, v.manufacturer].filter(Boolean).join(" \u00B7 ");

    app.innerHTML =
      '<div class="gal"><img class="main-img" id="main" src="'+esc(imgs[0])+'" alt="'+esc(v.name)+'"><span class="counter" id="count">Item 1/'+imgs.length+'</span></div>' +
      (imgs.length>1 ? '<div class="thumbs" id="thumbs">'+imgs.map(function(s,i){return '<img src="'+esc(s)+'" data-i="'+i+'" class="'+(i?"":"on")+'" alt="Photo '+(i+1)+'">';}).join("")+'</div>' : "") +
      '<section><h1>'+esc(v.name)+(v.variantLabel?' ('+esc(v.variantLabel)+')':'')+'</h1>' +
      (info ? '<div class="meta">'+esc(info)+'</div>' : "") +
      '<div class="badges">' +
        (v.requiresPrescription ? '<span class="badge rx">Prescription required</span>' : '') +
        (v.nafdacNo ? '<span class="badge">NAFDAC '+esc(v.nafdacNo)+'</span>' : '') +
        (expired ? '<span class="badge out">Expired</span>' : out ? '<span class="badge out">Out of stock</span>' : lowS ? '<span class="badge low">Only '+stock+' left</span>' : '<span class="badge">In stock</span>') +
      '</div>' + opts + '</section>' +
      '<div class="price-box"><div class="tag">FAEXXOR price</div><div class="body"><span class="price">'+money(v.price)+'</span>' +
        (v.wholesalePrice > 0 && v.wholesalePrice <= v.price && v.wholesaleMinQty >= 2 ? '<div class="tier">Buy '+v.wholesaleMinQty+' or more: <b>'+money(v.wholesalePrice)+'</b> each</div>' : '') +
        '</div></div>' +
      '<div class="gap"></div>' +
      '<section><div class="row"><span>Delivery</span><b>1 - 24 hours after confirmation</b></div>' +
      '<div class="row"><span>Areas</span><b>Yola, Gombe, Borno, Taraba</b></div>' +
      '<div class="row"><a href="returns.html" style="color:inherit;font-weight:600;text-decoration:none">Return &amp; refund policy</a><span>\u203A</span></div></section>' +
      '<div class="gap"></div>' +
      (v.uses||v.dosage||v.sideEffects||v.warnings||v.storage ? '<h2>Medicine information</h2>' : '') +
      section("Uses", v.uses, true) + section("Dosage", v.dosage) + section("Side effects", v.sideEffects) +
      section("Warnings", v.warnings) + section("Storage", v.storage) +
      '<div class="bar"><button class="cart" id="add" '+(cant?"disabled":"")+'>'+(out?"Out of stock":cartLabel(v))+'</button>' +
      '<button class="buy" id="buy" '+(cant?"disabled":"")+'>'+(v.requiresPrescription?"Upload prescription":"Buy now")+'</button></div>';

    var main = document.getElementById("main");
    main.onerror = function(){ main.onerror = null; main.src = PH; };
    var th = document.getElementById("thumbs");
    if (th) th.onclick = function(e){
      var i = e.target.dataset.i; if (i === undefined) return;
      main.src = imgs[i];
      document.getElementById("count").textContent = "Item " + (+i+1) + "/" + imgs.length;
      [].forEach.call(th.children, function(t){ t.classList.toggle("on", t.dataset.i === i); });
    };
    [].forEach.call(document.querySelectorAll(".opts button"), function(b){
      b.onclick = function(){ vi = +b.dataset.v; draw(); };
    });
    document.getElementById("add").onclick = function(){ addIt(false); };
    document.getElementById("buy").onclick = function(){
      if (v.requiresPrescription) { location.href = "prescription.html"; return; }
      addIt(true);
    };
  }

  function cartLabel(v){ var q = FXCart.qty(v.id); return q ? "Add more (" + q + " in cart)" : "Add to cart"; }
  function badge(){
    var el = document.getElementById("cbadge"), n = FXCart.count();
    el.textContent = n; el.style.display = n ? "grid" : "none";
  }
  var toastTimer;
  function toast(msg, link){
    var t = document.getElementById("toast");
    if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
    t.innerHTML = "<span>" + esc(msg) + "</span>" + (link ? '<a href="index.html?cart=1">' + link + "</a>" : "");
    t.classList.add("on"); clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("on"); }, 2600);
  }
  function addIt(goCheckout){
    var v = variants[vi], name = v.variantLabel ? v.name + " (" + v.variantLabel + ")" : v.name;
    var stock = Number.isInteger(v.stockQuantity) ? v.stockQuantity : null, q = FXCart.qty(v.id);
    if (goCheckout && q > 0) { location.href = "checkout.html"; return; }
    if (stock !== null && q >= stock) { toast("Only " + stock + " available in stock"); return; }
    FXCart.add(name, v.price, v.id);
    badge();
    if (goCheckout) { location.href = "checkout.html"; return; }
    var b = document.getElementById("add");
    b.textContent = "Added \u2713";
    toast("Added to cart", "View cart");
    setTimeout(function(){ if (b.isConnected) b.textContent = cartLabel(v); }, 1200);
  }
  badge();
})();
</script>
</body>
</html>

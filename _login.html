<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | FAEXXOR Pharmacy</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
<main class="auth-layout">

  <aside class="auth-brand">
    <div class="brand">
      <span class="brand-name">FAEXXOR</span>
      <span class="brand-sub">Pharmacy</span>
    </div>
    <p class="brand-message">Trusted medicines, delivered with care.</p>
  </aside>

  <section class="auth-panel">
    <div class="auth-card">

      <div class="brand brand-mobile">
        <span class="brand-name">FAEXXOR</span>
        <span class="brand-sub">Pharmacy</span>
      </div>

      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to your FAEXXOR Pharmacy account</p>

      <div id="message" class="message" role="alert" aria-live="polite" hidden></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" autocomplete="email" required>
          <small class="field-error" id="emailError"></small>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" autocomplete="current-password" required>
            <button type="button" id="togglePassword" class="toggle" aria-label="Show password">Show</button>
          </div>
          <small class="field-error" id="passwordError"></small>
        </div>

        <div class="row">
          <label class="check">
            <input type="checkbox" id="remember"> Remember me
          </label>
          <a href="#" id="forgotLink">Forgot Password?</a>
        </div>

        <button type="submit" id="loginBtn" class="btn-primary">Login</button>
      </form>

      <form id="resetForm" hidden novalidate>
        <h2>Reset your password</h2>
        <div class="field">
          <label for="resetEmail">Enter your email address</label>
          <input type="email" id="resetEmail" autocomplete="email" required>
        </div>
        <button type="submit" id="resetBtn" class="btn-primary">Send Reset Link</button>
        <button type="button" id="backToLogin" class="btn-link">Back to login</button>
      </form>

      <p class="switch">
        Don't have an account?
        <a href="signup.html">Create an account</a>
      </p>
    </div>
  </section>

</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<script src="auth.js"></script>
</body>
</html>

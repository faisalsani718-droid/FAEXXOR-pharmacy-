<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot Password | FAEXXOR Pharmacy</title>
<meta name="description" content="Forgot Password - FAEXXOR Pharmacy, Yola, Adamawa State, Nigeria.">
<link rel="stylesheet" href="pages.css">
</head>
<body>
<header class="ph"><a href="index.html">FAEXXOR Pharmacy</a></header>
<main class="pm">
<h1>Reset your password</h1>
<div class="card"><p>Enter your account email. We will send you a reset link.</p>
<input id="em" type="email" placeholder="Email address" autocomplete="email">
<button class="btn" id="go">Send reset link</button><p class="msg" id="msg"></p></div>
<a class="btn alt" href="login.html">Back to Login</a>
</main>
<footer class="pf">
<a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="returns.html">Returns</a>
<p>&copy; 2026 FAEXXOR Pharmacy</p>
</footer>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<script>
document.getElementById("go").onclick=function(){
var e=document.getElementById("em").value.trim(),m=document.getElementById("msg");
if(!e){m.textContent="Please enter your email.";return;}
m.textContent="Sending...";
firebase.auth().sendPasswordResetEmail(e).then(function(){m.style.color="#16a34a";m.textContent="Done. Check your inbox (and spam folder).";}).catch(function(x){m.style.color="#dc2626";m.textContent=x.code==="auth/invalid-email"?"That email is not valid.":"Could not send. Try again.";});
};
</script>
</body>
</html>
